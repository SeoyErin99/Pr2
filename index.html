<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NOTHIKNING</title>
<!-- 폰트: Pretendard -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* =====================================================================
   기본 색상 / 공통 값 (여기서 색만 바꿔도 전체 분위기가 바뀝니다)
   ===================================================================== */
:root{
  --red:#ff5a5a;          /* 아이템이 돌아다니는 빨간 공간 */
  --ink:#111111;          /* 검은 버튼, 선 */
  --wave:#cfc9c0;         /* 하단 글씨 색 */
  --logo:#d2d2d2;         /* 우측 상단 로고 색 */
  --label:#ff6b6b;        /* 메뉴 호버 라벨 색 */
  --header:40px;          /* 상단 바 높이 */
  --fade:1400ms;          /* 창 전환 페이드 시간 (JS의 CONFIG.FADE_MS와 같게 맞추기) */
}

*{box-sizing:border-box;margin:0;padding:0;
  -webkit-user-select:none;user-select:none;           /* 모든 창 텍스트 선택 금지 */
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  touch-action:none;overscroll-behavior:none;color:var(--ink)}
img{-webkit-user-drag:none;pointer-events:none;display:block}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}

/* ---------------- 상단 바 ---------------- */
#header{position:fixed;left:0;right:0;top:0;height:var(--header);background:#fff;
  border-bottom:1px solid #e4e4e4;z-index:60;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px}
#menuBtn{width:30px;height:30px;display:grid;place-items:center;margin-left:-6px}
#menuBtn svg{width:16px;height:16px;transition:transform .5s ease}
#menuBtn.on svg{transform:rotate(90deg)}
#logo{font-weight:300;font-size:14px;color:var(--logo);letter-spacing:.01em;cursor:pointer}

/* ---------------- 페이지(창) + 페이드 ---------------- */
.page{position:fixed;left:0;right:0;top:calc(var(--header) + 1px);bottom:0;overflow:hidden;
  opacity:0;visibility:hidden;transition:opacity var(--fade) ease,visibility 0s linear var(--fade)}
.page.show{opacity:1;visibility:visible;transition:opacity var(--fade) ease,visibility 0s}

/* ---------------- 메인 ---------------- */
#area{position:absolute;background:transparent;z-index:1;pointer-events:none}   /* 움직임 범위(실제 화면에선 흰 바탕) */
#area.show{background:var(--red)}   /* CONFIG.SHOW_AREA:true 로 범위 확인 가능 */
#wave{position:absolute;z-index:0;text-align:right;font-weight:200;color:var(--wave);
  line-height:1.12;white-space:nowrap;pointer-events:none}
#wave .line{display:block;white-space:pre}
#wave .ch{display:inline-block;transform-origin:50% 75%;
  animation:wave var(--loop,2s) ease-in-out infinite}

.item{position:absolute;left:0;top:0;z-index:2;transform-origin:0 0;cursor:grab;touch-action:none;will-change:transform}
.item img{width:100%;height:100%;object-fit:contain;transition:transform .25s ease}
.item.dragging{z-index:100;cursor:grabbing}
.item.docked{z-index:7}
.item.missing{border-radius:50%;border:2px dashed #ccc;background:rgba(0,0,0,.03)}
@media (hover:hover) and (pointer:fine){ .item:hover img{transform:scale(1.12)} .item.docked:hover img{transform:scale(1.15)} }  /* PC 마우스 오버 1.12배 (기기 화면 속 아이템은 1.15배) */

#device{position:absolute;z-index:3;cursor:grab;touch-action:none;transition:transform .3s ease}
#device.grabbing{cursor:grabbing;z-index:8}
#device img{position:absolute;transition:opacity .25s ease}
#devBase{left:0;top:0;width:100%;height:100%}
#devDrag{opacity:0}
#device #devFace{object-fit:contain;transition:none}   /* 얼굴은 효과 없이 바로 바뀜 */
#device #devFace.off{visibility:hidden}
#devItem{object-fit:contain;padding:8%;opacity:0}   /* 아이템을 기기 위로 끌었을 때 화면에 보이는 아이템 */
#device.hover{transform:scale(1.04)}
#device.hover #devBase,#device.hover #devFace{opacity:0}
#device.hover #devDrag{opacity:1}       /* 기기 위로 끌고 있을 때는 drag 이미지만 (아이템은 놓은 뒤 로딩이 끝나야 화면에 뜸) */

#bubble{position:absolute;z-index:6;background:#fafafa;border:1.2px solid var(--ink);border-radius:20px;
  width:max-content;text-align:center;min-width:64px;
  padding:9px 18px;min-height:42px;font-weight:400;color:#222;line-height:1.42;word-break:keep-all;
  transform-origin:var(--tail,80%) 100%;opacity:0;visibility:hidden;transform:translateY(8px) scale(.85);
  transition:none}                                   /* 사라질 때는 바로 */
#bubble.show{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .45s cubic-bezier(.3,1.5,.5,1),visibility 0s}
#bubble.below{transform-origin:var(--tail,80%) 0}
#bubble.below::after{bottom:auto;top:-8px;transform:skewY(30deg) rotate(205deg)}
#bubble::after{content:"";position:absolute;left:calc(var(--tail,80%) - 6px);bottom:-8px;width:13px;height:13px;background:#fafafa;
  border-right:1.2px solid var(--ink);border-bottom:1.2px solid var(--ink);transform:skewY(30deg) rotate(25deg)}
#bubble .caret{display:none;width:1.5px;height:1.05em;background:#222;vertical-align:-.15em;margin-left:2px;
  animation:blink .8s steps(1) infinite}
#bubble.typing .caret{display:inline-block}
@keyframes blink{50%{opacity:0}}

#goBtn{position:absolute;z-index:6;border-radius:50%;background:var(--ink);display:grid;place-items:center;
  transform:scale(0);transition:none}
#goBtn.show{transform:scale(1);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
#goBtn svg{width:58%;height:58%}
@media (hover:hover){ #goBtn.show:hover{transform:scale(1.1)} }

#loadIco{position:absolute;z-index:6;display:none;pointer-events:none}
#loadIco.show{display:block}
#loadIco .hg{display:block;width:46%;margin:0 auto 14%;overflow:visible;transform-origin:50% 50%}
#loadIco .hg rect{fill:#111}
#loadIco .lt{position:relative}
#loadIco .lt img{display:block;width:100%;height:auto}
#loadIco .dots{position:absolute;left:100%;bottom:0;display:flex;gap:var(--dg);margin-left:var(--dg)}
#loadIco .dots i{width:var(--ds);height:var(--ds);background:#111;visibility:hidden}
#loadIco[data-n="1"] .dots i:nth-child(1),#loadIco[data-n="2"] .dots i{visibility:visible}
.ghost{position:absolute;z-index:120;pointer-events:none;transform-origin:50% 50%}
.ghost img{width:100%;height:100%;object-fit:contain}
.hand{position:absolute;z-index:121;width:34px;height:34px;pointer-events:none}

/* ---------------- 메뉴 ---------------- */
#menu{position:fixed;left:0;right:0;top:calc(var(--header) + 1px);bottom:0;background:transparent;z-index:50;pointer-events:none;
  padding:10px 24px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
#menu.open{opacity:1;visibility:visible;transition:opacity .25s ease,visibility 0s}
#menu ul{list-style:none;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
#menu li{display:flex;align-items:center;gap:12px;cursor:pointer;opacity:0}
#menu.open li{pointer-events:auto}
#menu .mc{background:#fff}
#menu.open li{animation:drop .9s cubic-bezier(.3,.7,.4,1) both}
#menu.open li:nth-child(2){animation-delay:.14s}
#menu.open li:nth-child(3){animation-delay:.28s}
@keyframes drop{
  0%{transform:translateY(-160px);opacity:0}
  45%{transform:translateY(10px);opacity:1}
  65%{transform:translateY(-8px)}
  82%{transform:translateY(3px)}
  100%{transform:translateY(0);opacity:1}}
#menu .mc{width:var(--mc,42px);height:var(--mc,42px);border:1px solid var(--ink);border-radius:50%;
  display:grid;place-items:center;transition:width .35s cubic-bezier(.3,1.4,.5,1),height .35s cubic-bezier(.3,1.4,.5,1)}
#menu .mc svg{width:50%;height:50%}
#menu em{font-style:normal;font-weight:300;color:var(--label);font-size:18px;opacity:0;transform:translateX(-8px);
  transition:opacity .3s ease,transform .3s ease}
#menu li:hover .mc,#menu li.touch .mc{width:var(--mcBig,58px);height:var(--mcBig,58px)}   /* 호버 시 커지고 → 아래 메뉴들이 자연스럽게 비켜남 */
#menu li:hover em,#menu li.touch em{opacity:1;transform:none}
#menu .vol{opacity:0;transform:translateX(-8px);transition:opacity .3s ease,transform .3s ease;display:flex;align-items:center}
#menu .vol input{width:120px;accent-color:var(--red);cursor:pointer;touch-action:none}
#menu li:hover .vol,#menu li.open .vol{opacity:1;transform:none}

/* ---------------- 아이템 모아보기 ---------------- */
#p-gallery{display:grid;place-items:center}
#grid{display:grid;grid-template-columns:repeat(4,var(--cell));gap:var(--gap)}
#grid .cell{width:var(--cell);height:var(--cell);border:1px solid var(--ink);border-radius:50%;display:grid;
  place-items:center;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#grid .cell img{width:62%;height:62%;object-fit:contain;animation:bob 3s ease-in-out infinite}
#grid .cell:nth-child(2) img{animation-delay:-.7s}#grid .cell:nth-child(3) img{animation-delay:-1.4s}#grid .cell:nth-child(4) img{animation-delay:-2.1s}
@media (hover:hover){ #grid .cell:hover{transform:scale(1.2)} }
@keyframes bob{50%{transform:translateY(-8%)}}

/* ---------------- 상단 가운데 제목 + 돌아가는 메뉴 ---------------- */
#hdCenter{position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);display:none;align-items:center}
body.on-exp #hdCenter{display:flex}
body.on-exp #logo{display:none}
#titleBtn{display:flex;align-items:center;gap:10px;font-weight:300;font-size:var(--hdFont,19px);color:#bdbdbd;white-space:nowrap}
#titleBtn .tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #bdbdbd;
  transition:transform .7s cubic-bezier(.35,1.4,.5,1)}
#titleBtn.open .tri{transform:rotate(540deg)}          /* 열림: 뾰족한 쪽이 위 (돌면서) */
#drum{position:fixed;left:50%;top:calc(var(--header) + 6px);width:300px;height:250px;margin-left:-150px;z-index:58;
  perspective:620px;visibility:hidden;pointer-events:none;clip-path:inset(0 -80px 100% -80px);touch-action:none;
  transition:clip-path .55s cubic-bezier(.3,.8,.3,1),visibility 0s linear .55s}
#drum.open{visibility:visible;pointer-events:auto;clip-path:inset(-20px -80px -20px -80px);transition:clip-path .7s cubic-bezier(.3,.8,.3,1),visibility 0s}
#drum .wheel{position:absolute;inset:0;transform-style:preserve-3d}
#drum .slot{position:absolute;left:50%;top:50%;width:224px;height:46px;margin:-23px 0 0 -112px;backface-visibility:hidden;cursor:pointer}
#drum .box{width:100%;height:100%;display:grid;place-items:center;border:1px solid #111;background:#fafafa;color:#222;
  font-weight:300;font-size:21px;transition:transform .25s ease,background .25s ease,color .25s ease}
#drum .arr{position:absolute;right:-56px;top:50%;width:36px;height:22px;margin-top:-11px;opacity:0;transform:translateX(10px);
  transition:opacity .25s ease,transform .25s ease}
#drum .slot.hl .box{transform:scale(1.1);background:var(--red);color:#fff}
#drum .slot.hl .arr{opacity:1;transform:none}
@media (hover:hover) and (pointer:fine){
  #drum .slot{cursor:pointer}
}

/* ---------------- how to play ---------------- */
#how{display:none;position:relative;height:100%;align-items:center}
body.on-exp #how{display:flex}
#howBtn{display:flex;align-items:center;gap:8px;font-weight:300;font-size:var(--hdFont,19px);color:#c4c4c4;white-space:nowrap;transition:color .25s ease}
#howBtn svg{width:0;height:16px;opacity:0;transition:width .3s ease,opacity .3s ease}
#howPanel{position:absolute;right:0;top:100%;margin-top:12px;width:max-content;max-width:calc(100vw - 24px);background:#fafafa;border:1px solid #111;
  padding:16px 18px 16px 16px;display:flex;gap:14px;opacity:0;visibility:hidden;transform:translateY(-10px);
  transition:opacity .3s ease,transform .3s ease,visibility 0s linear .3s}
#howPanel::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px}
#howPanel .q{font-weight:800;font-size:46px;line-height:.9;color:#111}
#howPanel ul{list-style:none;font-size:14px;line-height:1.6;color:#333;font-weight:400;word-break:keep-all;padding-top:2px}
#howPanel li{white-space:nowrap}
#howPanel li::before{content:"· "}
@media (max-width:767px){ #howPanel li{white-space:normal} }
#how.open #howBtn{color:var(--label)} #how.open #howBtn svg{width:30px;opacity:1}
#how.open #howPanel{opacity:1;visibility:visible;transform:none;transition:opacity .3s ease,transform .3s ease,visibility 0s}
@media (hover:hover) and (pointer:fine){
  #how:hover #howBtn{color:var(--label)} #how:hover #howBtn svg{width:30px;opacity:1}
  #how:hover #howPanel{opacity:1;visibility:visible;transform:none;transition:opacity .3s ease,transform .3s ease,visibility 0s}
}
@media (max-width:767px){ :root{--hdFont:14px} #drum{transform:scale(.85);transform-origin:50% 0} }

/* ---------------- 어항 체험 ---------------- */
.aq{position:absolute;left:0;top:0;transform-origin:0 0}
.aq img,.aq .fish,.aq .bub,.aq .ripple{position:absolute;left:0;top:0}
.aq .plant{transform-origin:50% 100%;animation:sway var(--d,5s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes sway{0%{transform:rotate(-1.8deg) skewX(2deg)}100%{transform:rotate(1.8deg) skewX(-2.5deg)}}
.aq .water{animation:ripple-water 4.5s ease-in-out infinite;transform-origin:50% 50%}
.aq .water2{opacity:.55;animation:ripple-water 6s ease-in-out -2s infinite reverse}
@keyframes ripple-water{0%,100%{transform:translateX(0) scaleY(1)}25%{transform:translateX(-7px) scaleY(1.35)}50%{transform:translateX(3px) scaleY(.8)}75%{transform:translateX(6px) scaleY(1.2)}}
.aq .fish{transform-origin:50% 50%;will-change:transform}
.aq .fish img{position:static;width:100%;height:100%}
.aq .bub{border-radius:50%;border:1.5px solid rgba(110,170,205,.75);
  background:radial-gradient(circle at 32% 30%,#fff 0 16%,rgba(255,255,255,.35) 32%,rgba(170,215,240,.25) 75%);
  box-shadow:inset 0 0 5px rgba(255,255,255,.9)}
.aq .ripple{border-radius:50%;border:2px solid rgba(255,255,255,.9);pointer-events:none}
.aq .feed{filter:none;z-index:30}                 /* 먹이통은 항상 맨 앞 */
.aq-depth{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0}

/* ---------------- 키보드 체험 ---------------- */
.kbd{position:absolute;left:0;top:0;transform-origin:0 0}
.kbd img{position:absolute;left:0;top:0}
.kbd .key{position:absolute;border-radius:6px}
.kbd .key i{display:block;width:100%;height:100%;border-radius:6px;transition:transform .045s ease,filter .045s ease}
.kbd .key.on{background:rgba(0,0,0,.32);box-shadow:inset 0 0 5px rgba(0,0,0,.55)}       /* 눌린 키 아래 어두운 홈 */
.kbd .key.on i{transform:translateY(3px) scale(.9);filter:brightness(.82)}
.kb-top,.kb-bot{position:absolute;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px}
.kb-dots{display:flex;align-items:center;gap:18px}
.kb-dot{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:width .3s cubic-bezier(.3,1.5,.5,1),height .3s cubic-bezier(.3,1.5,.5,1);touch-action:manipulation}
.kb-dot.on{width:42px;height:42px}                         /* 선택된 색은 크게 */
.kb-sounds{display:flex;gap:8px}
.kb-sounds button{width:120px;height:36px;border:1px solid #111;background:#fafafa;font-weight:300;font-size:15px;color:#333;transition:background .2s,color .2s;touch-action:manipulation}
.kb-sounds button.on{background:#111;color:#fff}           /* 선택된 소리는 검은색 */
@media (hover:hover) and (pointer:fine){ .kb-dot:not(.on):hover{transform:scale(1.12)} .kb-sounds button:not(.on):hover{background:#eee} }
.kb-top.sm .kb-dots{gap:9px} .kb-top.sm .kb-dot{width:20px;height:20px} .kb-top.sm .kb-dot.on{width:30px;height:30px}
.kb-top.sm .kb-sounds{gap:5px} .kb-top.sm .kb-sounds button{width:auto;padding:0 9px;height:28px;font-size:12px}
.kb-input{flex:1;min-width:0;height:44px;border:0;border-bottom:1.5px solid #8a8a8a;background:transparent;padding:0 6px;font:300 20px 'Pretendard',sans-serif;color:#222;
  outline:none;border-radius:0;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.kb-input:focus{border-bottom-color:#111}
.kb-input::placeholder{color:#b9b9b9;font-weight:300}
.kb-reset{position:relative;width:48px;height:48px;border-radius:50%;background:#111;display:grid;place-items:center;flex:none;touch-action:manipulation;transition:background .2s}
.kb-reset svg{width:24px;height:24px}
.kb-reset .tip{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,6px);white-space:nowrap;background:var(--red);color:#fff;
  font-size:13px;font-weight:400;padding:5px 10px;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;pointer-events:none}
.kb-reset .tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--red)}
.kb-reset.armed .tip{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s,visibility 0s}
.kb-reset.armed{background:var(--red)}
@media (hover:hover) and (pointer:fine){ .kb-reset:hover .tip{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s,visibility 0s} .kb-reset:hover{background:var(--red)} }

/* ---------------- 빵 스퀴시 ---------------- */
.bk{position:absolute;inset:0}
.bk-case{position:absolute}
.bk-case img{display:block;width:100%;height:100%}
.bk-bread{position:absolute;object-fit:contain;transform-origin:50% 100%;
  transition:left .6s cubic-bezier(.5,0,.2,1),top .6s cubic-bezier(.5,0,.2,1),width .6s cubic-bezier(.5,0,.2,1),height .6s cubic-bezier(.5,0,.2,1),transform .25s ease}
.bk-bread.noanim{transition:transform .25s ease}
.bk-bread.hov{transform:scale(1.2)}                          /* 호버 1.2배 */
.bk-bread.out{z-index:3}
.bk-cv{position:absolute;opacity:0;pointer-events:none;z-index:4}
.bk-cv.on{opacity:1}
.bk-label{position:absolute;transform:translateX(-50%);font-weight:300;font-size:14px;color:#a39a92;letter-spacing:.02em;white-space:nowrap;opacity:0;transition:opacity .2s}
.bk-label.on{opacity:1}

/* ---------------- 체험 창 ---------------- */
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:crosshair}
.zoom{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
.zoom canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>

<header id="header">
  <button id="menuBtn" aria-label="menu">
    <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2.4" fill="#111"/><rect x="1" y="6.8" width="14" height="2.4" fill="#111"/><rect x="1" y="11.6" width="14" height="2.4" fill="#111"/></svg>
  </button>
  <div id="hdCenter">
    <button id="titleBtn"><span id="titleText"></span><i class="tri"></i></button>
  </div>
  <div id="logo">NOTHIKNING</div>
  <div id="how">
    <button id="howBtn"><svg viewBox="0 0 30 16"><path d="M1 5h18V0l10 8-10 8v-5H1z" fill="#ff5a5a"/></svg>how to play</button>
    <div id="howPanel"><span class="q">?</span><ul id="howList"></ul></div>
  </div>
</header>
<div id="drum"><div class="wheel"></div></div>

<nav id="menu">
  <ul>
    <li data-go="main"><span class="mc"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 12H6v9h12v-9h3.5z" fill="#111"/></svg></span><em data-label="home"></em></li>

const pick = (arr, not) => { if(arr.length < 2) return arr[0]; let v; do{ v = arr[Math.floor(Math.random()*arr.length)] }while(v===not); return v; };
const easeOut = k => 1 - Math.pow(1-k, 3);

/* ========================= 하단 글씨 파도 ========================= */
let waveKind = null;
function buildWave(lines){
  const wave = $('#wave'); wave.innerHTML = ''; const total = lines.join('').replace(/ /g,'').length; let n = 0;
  wave.style.setProperty('--loop', CONFIG.WAVE_LOOP_S + 's');
  wave.style.setProperty('--grow', CONFIG.WAVE_GROW);
  const pct = Math.min(100, CONFIG.WAVE_LETTER_S/CONFIG.WAVE_LOOP_S*100);
  const st = document.createElement('style');
  st.textContent = `@keyframes wave{0%{transform:scale(1)}${pct/2}%{transform:scale(var(--grow))}${pct}%,100%{transform:scale(1)}}`;
  document.head.appendChild(st);
  lines.forEach(line => {
    const l = document.createElement('span'); l.className = 'line';
    [...line].forEach(c => {
      if(c === ' '){ l.appendChild(document.createTextNode(' ')); return; }
      const s = document.createElement('span'); s.className = 'ch'; s.textContent = c;
      // 한 글자씩 순서대로: 전체 루프 안에서 앞 글자부터 차례로 커졌다 돌아옴
      s.style.animationDelay = ((n/Math.max(1,total-1))*CONFIG.WAVE_SWEEP_S) + 's';
      n++; l.appendChild(s);
    });
    wave.appendChild(l);
  });
}

/* ========================= 배치 계산 ========================= */
const Lt = {};   // 현재 배치 값
function layout(){
  isMob = mq.matches;
  const A = CONFIG.LAYOUT[isMob ? 'mob' : 'pc'], d = D();
  const W = mainPage.clientWidth, H = mainPage.clientHeight, p = A.pad;
  Lt.W = W; Lt.H = H;
  // 빨간 공간
  Lt.area = { x:p, y:p, w:W - p*2, h:Math.round(H*A.areaH) };
  Object.assign(area.style, { left:p+'px', top:p+'px', width:Lt.area.w+'px', height:Lt.area.h+'px' });
  area.classList.toggle('show', !!CONFIG.SHOW_AREA);
  // 기기 크기 (위치는 placeDevice 에서)
  let ch = H*A.deviceH, boxH = ch/d.box.h, boxW = boxH/d.ratio;
  if(boxW*d.box.w > W*A.deviceMaxW){ boxW = W*A.deviceMaxW/d.box.w; boxH = boxW*d.ratio; }
  device.style.width = boxW+'px'; device.style.height = boxH+'px';
  Lt.box = { w:boxW, h:boxH }; Lt.pad = p; Lt.A = A;
  const cw = boxW*d.box.w, chh = boxH*d.box.h;
  Lt.floor = H - p*.4 - chh;                         // 기기가 떨어져 멈추는 바닥
  if(devS.x === null) devS.x = p;
  devS.x = clamp(devS.x, p*.4, W - p*.4 - cw);
  if(!devS.drag && !devS.fall) devS.y = Lt.floor; else devS.y = Math.min(devS.y, Lt.floor);
  // 말풍선 / 검은 버튼 크기
  Lt.bw = clamp(Math.max(cw*A.bubbleW, A.bubbleMin), 0, W - p*2);
  bubble.style.maxWidth = Math.min(W - p*2, 440)+'px'; bubble.style.fontSize = clamp(W*.0125, 12, 16)+'px';
  goBtn.style.width = goBtn.style.height = A.btn+'px';
  // 하단 글씨 (레이어 맨 뒤, 우측 하단 고정)
  const wave = $('#wave');
  if(waveKind !== isMob){ waveKind = isMob; buildWave(isMob ? CONFIG.WAVE_TEXT_MOB : CONFIG.WAVE_TEXT); }
  const fs = Math.min(A.textMax, W*A.textVW);
  Object.assign(wave.style, { right:p+'px', bottom:p+'px', top:'auto', fontSize:fs+'px' });
  placeDevice();
  // 아이템 크기 배율
  Lt.scale = clamp(Math.min(Lt.area.w/(isMob ? 620 : 1000), Lt.area.h/430), .55, 1.25);   // 아이템 크기 자동 배율
  applyDeviceAssets();
  items.forEach(it => { sizeItem(it); keepInside(it); });
  // 메뉴 / 모아보기
  const n = CONFIG.ITEMS.length, cols = isMob ? 2 : Math.min(5, n), rows = Math.ceil(n/cols);
  const cell = Math.min(W*(isMob ? .38 : .78/cols), (H - 40)/rows*.8);
  const grid = $('#grid'); grid.style.setProperty('--cell', cell+'px'); grid.style.setProperty('--gap', (cell*.18)+'px');
  grid.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
  expPages.forEach(ep => ep.resize());
}

/* ========================= 기기 위치 (끌기 + 중력) ========================= */
const devS = { x:null, y:0, vy:0, drag:false, fall:false };
function placeDevice(){
  const d = D(), A = Lt.A, p = Lt.pad, W = Lt.W, H = Lt.H, bw = bubble.offsetWidth || Lt.bw;
  const cw = Lt.box.w*d.box.w, ch = Lt.box.h*d.box.h;
  device.style.left = (devS.x - Lt.box.w*d.box.x)+'px'; device.style.top = (devS.y - Lt.box.h*d.box.y)+'px';
  Lt.dev = { x:devS.x, y:devS.y, w:cw, h:ch };
  Lt.dock = { x:devS.x + cw*A.dockX, y:devS.y + ch*A.dockY, size:cw*A.dockSize };
  const bx = devS.x - Lt.box.w*d.box.x, by = devS.y - Lt.box.h*d.box.y;   // 기기 화면 영역(아이템이 뜨는 곳)
  Lt.scr = { w:Lt.box.w*d.screen.w, h:Lt.box.h*d.screen.h };
  Lt.scr.cx = bx + Lt.box.w*d.screen.x + Lt.scr.w/2; Lt.scr.cy = by + Lt.box.h*d.screen.y + Lt.scr.h/2;
  // 말풍선: 기기 위 (위쪽 공간이 없으면 아래)
  const bl = clamp(devS.x + cw*CONFIG.BUBBLE.x, p, W - p - bw), bh = bubble.offsetHeight || 44;
  const below = devS.y - bh - 14 < 4;
  bubble.classList.toggle('below', below);
  bubble.style.left = bl+'px';
  if(below){ bubble.style.top = (devS.y + ch + 14)+'px'; bubble.style.bottom = 'auto'; }
  else { bubble.style.bottom = (H - devS.y + CONFIG.BUBBLE.up)+'px'; bubble.style.top = 'auto'; }
  bubble.style.setProperty('--tail', clamp(devS.x + cw*.5 - bl, 22, bw - 22)+'px');
  // 로딩 아이콘: 기기 위 가운데
  const li = $('#loadIco'), lw = CONFIG.LOADING_ICON[isMob ? 'mob' : 'pc'], ds = Math.max(3, lw*.042);
  Object.assign(li.style, { width:lw+'px', left:(devS.x + cw/2 - lw/2 - cw*CONFIG.LOADING_ICON.shift)+'px', bottom:(H - devS.y + 10)+'px' });
  li.style.setProperty('--ds', ds+'px'); li.style.setProperty('--dg', (ds*.9)+'px');
  // 검은 버튼: 기기 오른쪽 (자리 없으면 왼쪽)
  let gx = devS.x + cw*.93; if(gx + A.btn > W - p) gx = devS.x - A.btn*1.05;
  goBtn.style.left = clamp(gx, p, W - p - A.btn)+'px'; goBtn.style.top = clamp(devS.y + ch*.18, 0, H - A.btn)+'px';
}
function deviceTick(dt){
  if(!devS.fall) return;
  devS.vy += CONFIG.DEVICE_GRAVITY*dt; devS.y += devS.vy*dt;
  if(devS.y >= Lt.floor){
    devS.y = Lt.floor;
    if(devS.vy > 260 && CONFIG.DEVICE_BOUNCE > 0) devS.vy = -devS.vy*CONFIG.DEVICE_BOUNCE;
    else { devS.vy = 0; devS.fall = false; }
  }
  placeDevice();
}

/* ========================= 기기(노트북/폰) 얼굴 상태 ========================= */
const face = { mode:'idle', group:'idle', idx:0, next:0, until:0 };
let lastAct = now(), assetKind = null;

function applyDeviceAssets(){
  const d = D(), kind = isMob ? 'mob' : 'pc';
  const s = d.screen, b = d.dragBox;
  const fpad = (1 - (CONFIG.FACE_SIZE[kind] ?? 1))/2*100;
  Object.assign(devFace.style, { left:s.x*100+'%', top:s.y*100+'%', width:s.w*100+'%', height:s.h*100+'%', padding:`0 ${fpad}%` });
  Object.assign(devItem.style, { left:s.x*100+'%', top:s.y*100+'%', width:s.w*100+'%', height:s.h*100+'%' });
  Object.assign(devDrag.style, { left:b.x*100+'%', top:b.y*100+'%', width:b.w*100+'%', height:b.h*100+'%' });
  device.classList.toggle('mob', isMob);
  if(assetKind !== kind){ assetKind = kind; devBase.src = d.basic; devDrag.src = d.drag; showFace(face.group, face.idx, false); }
}
function showFace(group, idx, anim = true){
  const list = D()[group]; idx = idx % list.length;
  face.group = group; face.idx = idx;
  const src = list[idx];
  if(devFace.getAttribute('src') !== src){
    devFace.src = src;   // 효과 없이 이미지만 교체
  }
}
function faceIdle(){
  face.mode = 'idle';
  const list = D().idle; let i; do{ i = Math.floor(Math.random()*list.length) }while(list.length > 1 && face.group === 'idle' && i === face.idx);
  showFace('idle', i); face.next = now() + CONFIG.IDLE_SWAP_MS;
}
function faceReact(){
  if(face.mode === 'loading') return;
  if(CONFIG.CLICK_FACES !== 'react'){ faceIdle(); return; }   // 기본 상태 PNG 중 랜덤
  face.mode = 'react'; face.until = now() + CONFIG.REACT_MS;
  const list = D().react; showFace('react', Math.floor(Math.random()*list.length));
}
function faceTick(t){
  if(face.mode === 'react' && t >= face.until) faceIdle();
  if(face.mode === 'idle'){
    if(t - lastAct > CONFIG.SLEEP_MS){ face.mode = 'sleep'; showFace('sleep', 0); }
    else if(t >= face.next) faceIdle();
  }
}
function activity(){ lastAct = now(); if(face.mode === 'sleep') faceIdle(); }
['pointermove','pointerdown','touchmove','touchstart','wheel','keydown'].forEach(ev => addEventListener(ev, activity, {passive:true}));

/* 기기 클릭/터치 → 반응 얼굴 */
/* 기기 끌기 → 놓으면 중력처럼 아래로 떨어져 고정 */
let devDown = null;
device.addEventListener('pointerdown', e => {
  if(navBusy) return; e.preventDefault();
  try{ device.setPointerCapture(e.pointerId); }catch(_){}
  const p = pagePt(e);
  devDown = { sx:e.clientX, sy:e.clientY, ox:p.x - devS.x, oy:p.y - devS.y, moved:false };
});
device.addEventListener('pointermove', e => {
  if(!devDown) return;
  if(!devDown.moved && Math.hypot(e.clientX - devDown.sx, e.clientY - devDown.sy) > 8){
    devDown.moved = true; devS.drag = true; devS.fall = false; devS.vy = 0; device.classList.add('grabbing');
  }
  if(!devDown.moved) return;
  const p = pagePt(e), cw = Lt.dev.w;
  devS.x = clamp(p.x - devDown.ox, Lt.pad*.4, Lt.W - Lt.pad*.4 - cw);
  devS.y = clamp(p.y - devDown.oy, 0, Lt.floor);
  placeDevice();
});
const devUp = e => {
  if(!devDown) return;
  if(!devDown.moved){ if(e.type === 'pointerup') faceReact(); }
  else { devS.drag = false; devS.fall = true; devS.vy = 0; device.classList.remove('grabbing'); }
  devDown = null;
};
device.addEventListener('pointerup', devUp);
device.addEventListener('pointercancel', devUp);

/* ========================= 모래시계 (픽셀) ========================= */
const HG = (() => {
  const frame = [], inner = {}, add = (x, y) => frame.push([x, y]);
  for(let x = 0; x < 19; x++){ add(x, 0); add(x, 2); add(x, 20); add(x, 22); }
  [1, 21].forEach(y => [0, 1, 17, 18].forEach(x => add(x, y)));
  const hw = y => y <= 5 || y >= 17 ? 6 : Math.abs(11 - y);     // 유리 안쪽 반폭 (가운데 11행이 목)
  for(let y = 3; y <= 19; y++){ const w = hw(y); add(9 - w - 2, y); add(9 - w - 1, y); add(9 + w + 1, y); add(9 + w + 2, y);
    inner[y] = []; for(let x = 9 - w; x <= 9 + w; x++) inner[y].push(x); }
  const svg = $('#loadIco .hg'), sand = svg.querySelector('.hg-sand');
  svg.querySelector('.hg-frame').innerHTML = frame.map(([x, y]) => `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`).join('');
  function draw(top, bot, stream, t){   // top/bot: 0~8 줄
    const cells = [];
    for(let i = 0; i < top; i++){ const y = 10 - i; inner[y].forEach(x => { if((x + y) % 2 === 0 || i < 2) cells.push([x, y]); }); }
    for(let i = 0; i < bot; i++){ const y = 19 - i; inner[y].forEach(x => { if((x + y) % 2 === 0 || i < 2) cells.push([x, y]); }); }
    if(stream){ cells.push([9, 11]); for(let y = 12; y <= 19 - bot; y++) if((y + Math.floor(t*14)) % 2 === 0) cells.push([9, y]); }
    sand.innerHTML = cells.map(([x, y]) => `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`).join('');
  }
  return { svg, draw };
})();
function hourglass(tok, total){
  const flip = Math.min(500, total*.25), t0 = now();
  (function f(){
    if(tok !== loadTok) return;
    const t = now() - t0;
    if(t < flip){ const k = t/flip, e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
      HG.svg.style.transform = `rotate(${e*180}deg)`; HG.draw(0, 8, false, 0); }                 // 한 번 뒤집기
    else { HG.svg.style.transform = 'none'; const p = clamp((t - flip)/(total - flip - 80), 0, 1);
      HG.draw(Math.round(8*(1 - p)), Math.round(8*p), p > 0 && p < 1, t/1000); }               // 모래가 흘러내림
    if(t < total) requestAnimationFrame(f);
  })();
}

/* ========================= 말풍선 / 로딩 ========================= */
let loadTok = 0, docked = null;
function clearDesc(){
  loadTok++; bubbleText.textContent = ''; bubble.classList.remove('typing','show'); goBtn.classList.remove('show');
  devFace.classList.remove('off'); $('#loadIco').classList.remove('show');
  if(face.mode === 'loading') faceIdle();
}
function startLoading(it){
  clearDesc(); const tok = loadTok;
  face.mode = 'loading';
  const steps = D().loading.length;
  for(let i = 0; i < steps; i++) setTimeout(() => { if(tok === loadTok) showFace('loading', i, false); }, i*CONFIG.LOADING_STEP_MS);
  // 모래시계 + LOADING 뒤 온점 ( · → ·· ) 애니메이션을 로딩 동안 2번 반복
  const li = $('#loadIco'), total = steps*CONFIG.LOADING_STEP_MS, phase = total/(CONFIG.LOADING_DOT_LOOPS*3);
  li.dataset.n = 0; li.classList.add('show'); hourglass(tok, total);   // 모래시계 한 번 뒤집고 모래 흘러내림
  for(let j = 1; j < CONFIG.LOADING_DOT_LOOPS*3; j++) setTimeout(() => { if(tok === loadTok) li.dataset.n = j % 3; }, j*phase);
  setTimeout(() => {
    if(tok !== loadTok) return;
    li.classList.remove('show');
    faceIdle(); devFace.classList.add('off');                 // 화면에 얼굴 대신 아이템
    it.dockPhase = 'shown'; it.el.style.pointerEvents = '';
    it.sc = 0; it.op = 1; tween(it, Lt.scr.cx - it.w/2, Lt.scr.cy - it.h/2, fitSc(it), 380);
    bubble.classList.add('show'); placeDevice();
    const desc = Array.isArray(it.cfg.desc) ? pick(it.cfg.desc) : (it.cfg.desc || '');   // 배열이면 랜덤
    typeText(desc, tok, () => { goBtn.dataset.target = it.i; goBtn.classList.add('show'); });
  }, steps*CONFIG.LOADING_STEP_MS);
}
function typeText(str, tok, done){
  const chars = [...str]; let i = 0; bubble.classList.add('typing');
  (function tick(){
    if(tok !== loadTok) return;
    if(i >= chars.length){ bubble.classList.remove('typing'); done(); return; }
    bubbleText.textContent += chars[i++]; placeDevice();   // 문장 길이에 맞춰 말풍선 크기 갱신
    setTimeout(tick, chars[i-1] === ' ' ? CONFIG.TYPE_MS*.5 : CONFIG.TYPE_MS*rand(.7,1.4));
  })();
}
goBtn.addEventListener('click', () => { const i = +goBtn.dataset.target; if(!isNaN(i)) go('exp' + i); });

/* ========================= 떠다니는 아이템 ========================= */
const items = [];
function pagePt(e){ const r = mainPage.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
function inRect(p, r, pad = 0){ return p.x >= r.x - pad && p.x <= r.x + r.w + pad && p.y >= r.y - pad && p.y <= r.y + r.h + pad; }

CONFIG.ITEMS.forEach((cfg, i) => {
  const el = document.createElement('div'); el.className = 'item';
  const img = new Image(); img.alt = ''; img.draggable = false; img.src = cfg.src; el.appendChild(img);
  mainPage.appendChild(el);
  const it = { i, cfg, el, img, ar:1, w:0, h:0, r:0, x:0, y:0, vx:0, vy:0, ang:0, angV:0, gx:0, gy:0, sc:1, scT:1,
               state:'free', op:1, dockPhase:null, placed:false, pvx:0, pvy:0, lastPvx:0, lastMove:0, tw:null };
  img.onload = () => { it.ar = img.naturalHeight / img.naturalWidth || 1; el.classList.remove('missing'); sizeItem(it); };
  img.onerror = () => el.classList.add('missing');
  bindItem(it);
  items.push(it);
});

function sizeItem(it){
  const ow = it.w, oh = it.h;
  it.w = it.cfg.size * Lt.scale; it.h = it.w * it.ar; it.r = Math.max(it.w, it.h)/2 * .82;
  it.el.style.width = it.w + 'px'; it.el.style.height = it.h + 'px';
  if(!it.placed){
    const A = Lt.area;
    it.x = A.x + (it.cfg.x/100)*A.w - it.w/2; it.y = A.y + (it.cfg.y/100)*A.h - it.h/2;
    const a = (it.cfg.dir ?? rand(0,360)) * Math.PI/180, sp = it.cfg.speed * Lt.scale;
    it.vx = Math.cos(a)*sp; it.vy = Math.sin(a)*sp; it.placed = true;
  } else if(ow){ it.x += (ow - it.w)/2; it.y += (oh - it.h)/2; }
  it.gx = it.w/2; it.gy = it.h/2;
}
function keepInside(it){
  if(it.state !== 'free') return; const A = Lt.area;
  it.x = clamp(it.x, A.x, Math.max(A.x, A.x + A.w - it.w)); it.y = clamp(it.y, A.y, Math.max(A.y, A.y + A.h - it.h));
}
/* 회전 중심(pivot)을 바꿔도 화면 위치가 튀지 않게 보정 */
function setPivot(it, gx, gy){
  const dx = it.gx - gx, dy = it.gy - gy, c = Math.cos(it.ang)*it.sc, s = Math.sin(it.ang)*it.sc;
  it.x += dx - (c*dx - s*dy); it.y += dy - (s*dx + c*dy); it.gx = gx; it.gy = gy;
}
function render(it){
  it.el.style.transform = `translate3d(${it.x}px,${it.y}px,0) translate(${it.gx}px,${it.gy}px) rotate(${it.ang}rad) scale(${it.sc}) translate(${-it.gx}px,${-it.gy}px)`;
  it.el.style.opacity = it.op;
}
function tween(it, tx, ty, ts, dur, done, to){ it.tw = { fx:it.x, fy:it.y, fs:it.sc, tx, ty, ts, t0:now(), dur, done, fo:it.op, to:to ?? it.op }; }
const fitSc = it => Math.min(Lt.scr.w*CONFIG.SCREEN_ITEM/it.w, Lt.scr.h*CONFIG.SCREEN_ITEM/it.h);

function bindItem(it){
  const el = it.el;
  el.addEventListener('pointerdown', e => {
    if(it.state === 'return' || navBusy || it.tw) return;
    e.preventDefault(); e.stopPropagation();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    const p = pagePt(e);
    it.fromDock = it.state === 'docked'; device.classList.toggle('out', it.fromDock);
    if(it.state === 'docked'){ if(it.dockPhase !== 'shown') return; docked = null; it.dockPhase = null; clearDesc(); faceIdle(); it.el.classList.remove('docked'); }
    // 잡은 지점을 회전 중심으로
    const c = Math.cos(it.ang), s = Math.sin(it.ang), qx = p.x - it.x - it.gx, qy = p.y - it.y - it.gy;
    const lx = it.gx + ( c*qx + s*qy)/it.sc, ly = it.gy + (-s*qx + c*qy)/it.sc;
    setPivot(it, clamp(lx, 0, it.w), clamp(ly, 0, it.h));
    it.x = p.x - it.gx; it.y = p.y - it.gy;
    it.state = 'drag'; it.scT = 1; it.pvx = it.pvy = 0; it.lastMove = now(); it.lp = p; it.lt = e.timeStamp;
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if(it.state !== 'drag') return;
    const p = pagePt(e), dt = Math.max(1, e.timeStamp - it.lt)/1000;
    it.pvx = it.pvx*.55 + ((p.x - it.lp.x)/dt)*.45; it.pvy = it.pvy*.55 + ((p.y - it.lp.y)/dt)*.45;
    it.lp = p; it.lt = e.timeStamp; it.lastMove = now();
    it.x = p.x - it.gx; it.y = p.y - it.gy;
    const over = inRect(p, Lt.dev, 10);
    device.classList.toggle('hover', over);
  });
  const end = e => {
    if(it.state !== 'drag') return;
    el.classList.remove('dragging'); device.classList.remove('hover');
    const p = pagePt(e);
    if(inRect(p, Lt.dev, 10)) dock(it);
    else {
      const c = { x:it.x + it.w/2, y:it.y + it.h/2 };
      if(inRect(c, Lt.area)){
        it.state = 'free'; setPivot(it, it.w/2, it.h/2); keepInside(it);
        const sp = it.cfg.speed * Lt.scale, m = Math.hypot(it.pvx, it.pvy), lim = sp*5;
        if(m > sp){ const k = Math.min(m, lim)/m; it.vx = it.pvx*k; it.vy = it.pvy*k; }
      } else toArea(it);
    }
    it.pvx = it.pvy = 0;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function dock(it){
  if(docked && docked !== it) toArea(docked);
  docked = it; it.state = 'docked'; it.dockPhase = 'in'; it.el.classList.add('docked');
  it.el.style.pointerEvents = 'none'; clearDesc();
  setPivot(it, it.w/2, it.h/2);
  // ① 기기 화면 속으로 쏙 들어감 → ② 로딩 → ③ 화면에 아이템 표시
  tween(it, Lt.scr.cx - it.w/2, Lt.scr.cy - it.h/2, fitSc(it)*.15, 480, () => {
    if(docked !== it) return; it.dockPhase = 'loading'; startLoading(it);
  }, 0);
}
function toArea(it){
  it.state = 'return'; it.dockPhase = null; it.el.style.pointerEvents = ''; it.el.classList.remove('docked','dragging'); setPivot(it, it.w/2, it.h/2);
  const A = Lt.area, tx = A.x + rand(.1,.9)*(A.w - it.w), ty = A.y + rand(.1,.9)*(A.h - it.h);
  tween(it, tx, ty, 1, 900, () => {
    it.state = 'free'; const a = rand(0, Math.PI*2), sp = it.cfg.speed*Lt.scale; it.vx = Math.cos(a)*sp; it.vy = Math.sin(a)*sp;
  }, 1);
}

function physics(dt, t){
  const A = Lt.area, free = items.filter(i => i.state === 'free');
  for(const it of free){
    it.x += it.vx*dt; it.y += it.vy*dt;
    if(it.x < A.x){ it.x = A.x; it.vx = Math.abs(it.vx); }
    if(it.x + it.w > A.x + A.w){ it.x = A.x + A.w - it.w; it.vx = -Math.abs(it.vx); }
    if(it.y < A.y){ it.y = A.y; it.vy = Math.abs(it.vy); }
    if(it.y + it.h > A.y + A.h){ it.y = A.y + A.h - it.h; it.vy = -Math.abs(it.vy); }
  }
  // 아이템끼리 부딪히면 튕김
  for(let a = 0; a < free.length; a++) for(let b = a+1; b < free.length; b++){
    const A1 = free[a], B1 = free[b];
    const dx = (B1.x + B1.w/2) - (A1.x + A1.w/2), dy = (B1.y + B1.h/2) - (A1.y + A1.h/2), d = Math.hypot(dx, dy), R = A1.r + B1.r;
    if(d < R && d > .01){
      const nx = dx/d, ny = dy/d, o = (R - d)/2;
      A1.x -= nx*o; A1.y -= ny*o; B1.x += nx*o; B1.y += ny*o;
      const rel = (A1.vx - B1.vx)*nx + (A1.vy - B1.vy)*ny;
      if(rel > 0){ A1.vx -= rel*nx; A1.vy -= rel*ny; B1.vx += rel*nx; B1.vy += rel*ny; }
    }
  }
  // 끌고 있는 아이템에 부딪히면 밀려남
  for(const d of items){
    if(d.state !== 'drag') continue;
    const dcx = d.x + d.w/2, dcy = d.y + d.h/2, dr = d.r*d.sc;
    for(const it of free){
      const dx = (it.x + it.w/2) - dcx, dy = (it.y + it.h/2) - dcy, dist = Math.hypot(dx, dy), R = dr + it.r;
      if(dist < R && dist > .01){
        const nx = dx/dist, ny = dy/dist; it.x += nx*(R - dist); it.y += ny*(R - dist);
        const rel = it.vx*nx + it.vy*ny, out = Math.max((d.pvx*nx + d.pvy*ny)*CONFIG.PUSH, it.cfg.speed*Lt.scale*3, rel);
        it.vx += (out - rel)*nx; it.vy += (out - rel)*ny;
        const m = Math.hypot(it.vx, it.vy); if(m > 1100){ it.vx *= 1100/m; it.vy *= 1100/m; }
      }
    }
  }
  // 각자 정해진 속도로 천천히 복귀
  for(const it of free){
    const target = it.cfg.speed * Lt.scale, sp = Math.hypot(it.vx, it.vy);
    if(sp < 1){ const a = rand(0, 6.28); it.vx = Math.cos(a)*target; it.vy = Math.sin(a)*target; }
    else { const k = 1 + (target/sp - 1)*Math.min(1, dt*1.2); it.vx *= k; it.vy *= k; }
  }
  const G = CONFIG.DANGLE;
  for(const it of items){
    // 트윈 이동
    if(it.tw){
      const w = it.tw, k = easeOut(clamp((t - w.t0)/w.dur, 0, 1));
      it.x = w.fx + (w.tx - w.fx)*k; it.y = w.fy + (w.ty - w.fy)*k; it.sc = w.fs + (w.ts - w.fs)*k; it.op = w.fo + (w.to - w.fo)*k;
      if(k >= 1){ it.tw = null; w.done && w.done(); }
    } else if(it.state === 'docked'){            // 기기 화면 중앙에 붙어 있음 (기기를 옮겨도 따라감)
      it.x = Lt.scr.cx - it.w/2; it.y = Lt.scr.cy - it.h/2;
      if(it.dockPhase === 'shown'){ it.sc = fitSc(it); it.op = device.classList.contains('hover') ? 0 : 1; } else { it.op = 0; }   // 다른 아이템을 끌어올 땐 drag 이미지만
    }
    if(it.state === 'drag'){
      it.sc += (it.scT - it.sc)*Math.min(1, dt*12);
      if(t - it.lastMove > 60){ it.pvx *= Math.pow(.02, dt); it.pvy *= Math.pow(.02, dt); }
    }
    // 대롱대롱 (잡은 지점에 매달린 진자)
    const ax = (it.pvx - it.lastPvx)/Math.max(dt, .001); it.lastPvx = it.pvx;
    const hang = it.gy <= it.h*.6 ? 1 : -1;
    const targetAng = it.state === 'drag' ? clamp(-it.pvx*G.lag*hang, -G.max, G.max) : 0;
    const acc = -G.stiffness*(it.ang - targetAng) - G.damping*it.angV - (it.state === 'drag' ? clamp(ax, -6000, 6000)*G.swing*hang : 0);
    it.angV += acc*dt; it.ang = clamp(it.ang + it.angV*dt, -G.max, G.max);
    if(it.state !== 'drag' && Math.abs(it.ang) < .0005 && Math.abs(it.angV) < .001){ it.ang = 0; it.angV = 0; }
    render(it);
  }
}

function drawImg(ctx, img, x, y, w, rot = 0, alpha = 1){
  if(alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); if(rot) ctx.rotate(rot);
  if(img.complete && img.naturalWidth){ const h = w*img.naturalHeight/img.naturalWidth; ctx.drawImage(img, -w/2, -h/2, w, h); }
  else { ctx.fillStyle = 'rgba(180,180,180,.6)'; ctx.beginPath(); ctx.arc(0, 0, w/2, 0, 7); ctx.fill(); }
  ctx.restore();
}

let audioCtx = null, master = null, vol = .7, lastVol = .7, noiseBuf = null;
try{ const v = localStorage.getItem('nk-vol'); if(v !== null) vol = clamp(+v, 0, 1); }catch(_){}
function AC(){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); master = audioCtx.createGain(); master.gain.value = vol; master.connect(audioCtx.destination);
      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate); const ch = noiseBuf.getChannelData(0); for(let i = 0; i < ch.length; i++) ch[i] = Math.random()*2 - 1; }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(_){}
  return audioCtx && audioCtx.state === 'running' ? audioCtx : null;
}
addEventListener('pointerdown', () => AC(), { passive:true });   // 소리는 첫 터치 이후에만 재생 가능(브라우저 정책)
addEventListener('keydown', () => AC());
const VOL_ICON = v => `<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="#111"/>${v <= 0
  ? '<path d="M16 9.5l5 5M21 9.5l-5 5" stroke="#111" stroke-width="2" stroke-linecap="round"/>'
  : '<path d="M15.5 9a4 4 0 0 1 0 6" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>' + (v > .5 ? '<path d="M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>' : '')}</svg>`;
function setVolume(v){
  vol = clamp(v, 0, 1); if(vol > 0) lastVol = vol;
  if(master) master.gain.setTargetAtTime(vol, audioCtx.currentTime, .02);
  $('#volIcon').innerHTML = VOL_ICON(vol); $('#volRange').value = Math.round(vol*100);
  try{ localStorage.setItem('nk-vol', vol); }catch(_){}
}

function bloop(){
  const ac = AC(); if(!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), f = rand(420, 820);
  o.type = 'sine'; o.frequency.setValueAtTime(f*.55, t); o.frequency.exponentialRampToValueAtTime(f*1.9, t + .09);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .17);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + .2);
}

/* 5) 어항: 물고기 헤엄 / 누르면 흩어짐 / 먹이 따라오기 / 물방울 */
function Aquarium(){
  const C = CONFIG.AQUA, S = C.scene, T = C.tank;
  let W = 1, H = 1, k = 1, ox = 0, oy = 0, root, layer, bubLayer, fxLayer, feedEl, fish = [], bubs = [], t = 0, nextBub = 0;
  const FH = C.feed.w*317/171;
  const feed = { x:C.feed.x, y:C.feed.y, w:C.feed.w, h:FH, drag:false, dx:0, dy:0 };
  const mk = (src, cls, x, y, w) => { const i = new Image(); i.src = src; i.alt = ''; i.draggable = false; if(cls) i.className = cls;
    Object.assign(i.style, { left:x+'px', top:y+'px', width:w+'px' }); return i; };
  const toScene = p => ({ x:(p.x - ox)/k, y:(p.y - oy)/k });
  const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
  const plants = C.plants.map(p => ({ ...p, h:p.w*1.1 }));
  function newTarget(f){ f.tx = rand(T.x + f.w*.6, T.x + T.w - f.w*.6); f.ty = rand(T.y + f.h, T.y + T.h - f.h); f.re = t + rand(3, 7); }
  // 수초 앞/뒤 이동: 겹친 수초가 없을 때만 깊이(z)를 바꿈 → 갑자기 튀어나오지 않음
  function maybeDepth(f){
    if(t < f.nextZ) return; f.nextZ = t + rand(5, 11);
    const nz = clamp(f.z + (Math.random() < .5 ? -2 : 2), 1, 9); if(nz === f.z) return;
    const lo = Math.min(nz, f.z), hi = Math.max(nz, f.z);
    const hit = plants.some(p => p.z > lo && p.z < hi && f.x + f.w/2 > p.x && f.x - f.w/2 < p.x + p.w && f.y + f.h/2 > p.y && f.y - f.h/2 < p.y + p.h);
    if(!hit){ f.z = nz; f.el.style.zIndex = nz; } else f.nextZ = t + .6;
  }
  function spawnBubbles(atX, atY){
    const n = Math.round(rand(C.bubbleCount[0] - .49, C.bubbleCount[1] + .49)) + (atX != null ? 1 : 0);
    for(let i = 0; i < n; i++) setTimeout(() => {      // 어항 속 여러 위치에서
      const d = rand(C.bubbleSize[0], C.bubbleSize[1]), el = document.createElement('div'); el.className = 'bub';
      el.style.width = el.style.height = d + 'px'; bubLayer.appendChild(el);
      bubs.push({ el, d, x:atX != null ? atX + rand(-18, 18) : rand(T.x + 40, T.x + T.w - 40), y:atY != null ? atY + rand(-10, 14) : rand(T.y + T.h*.55, T.y + T.h + 20), vy:-rand(65, 115), ph:rand(0, 6.28), life:1 });
      if(C.sound) bloop();
    }, i*(atX != null ? rand(70, 160) : rand(180, 420)));
  }
  return { bg:C.bg, dom:true,
    mount(zl){
      root = document.createElement('div'); root.className = 'aq'; root.style.width = S.w + 'px'; root.style.height = S.h + 'px';
      root.appendChild(mk(S.src, '', 0, 0, S.w));
      layer = document.createElement('div'); layer.className = 'aq-depth'; root.appendChild(layer);   // 수초 + 물고기 (z 로 앞뒤)
      plants.forEach((p, i) => { const e = mk(p.src, 'plant', p.x, p.y, p.w); e.style.zIndex = p.z; e.style.setProperty('--d', p.d + 's'); e.style.setProperty('--dl', (-i*1.9) + 's');
        e.onload = () => { p.h = p.w*e.naturalHeight/e.naturalWidth; }; layer.appendChild(e); });
      bubLayer = document.createElement('div'); root.appendChild(bubLayer);
      root.appendChild(mk(C.water.src, 'water', C.water.x, C.water.y, C.water.w));
      root.appendChild(mk(C.water.src, 'water water2', C.water.x, C.water.y + 3, C.water.w));
      root.appendChild(mk(C.glass.src, '', C.glass.x, C.glass.y, C.glass.w));
      fxLayer = document.createElement('div'); root.appendChild(fxLayer);
      feedEl = mk(C.feed.src, 'feed', 0, 0, feed.w); root.appendChild(feedEl);
      fish = C.fish.map(cfg => {
        const el = document.createElement('div'); el.className = 'fish'; const im = new Image(); im.src = cfg.src; im.alt = ''; im.draggable = false; el.appendChild(im);
        const f = { el, cfg, w:cfg.w, h:cfg.w*.45, x:cfg.x, y:cfg.y, hd:0, spd:cfg.speed, ra:0, face:1, sp:cfg.speed, scared:0, ph:rand(0, 6.28), ang0:rand(0, 6.28), z:cfg.z || 5, nextZ:rand(4, 9) };
        im.onload = () => { f.h = f.w*im.naturalHeight/im.naturalWidth; el.style.height = f.h + 'px'; };
        el.style.width = f.w + 'px'; el.style.height = f.h + 'px'; el.style.zIndex = f.z; layer.appendChild(el); return f;
      });
      zl.appendChild(root);
    },
    init(w, h){
      W = w; H = h; this.resize(w, h); t = 0; nextBub = 2;
      bubs.forEach(b => b.el.remove()); bubs = [];
      feed.x = C.feed.x; feed.y = C.feed.y; feed.drag = false;
      fish.forEach(f => { f.x = f.cfg.x; f.y = f.cfg.y; f.hd = Math.random() < .5 ? 0 : Math.PI; f.face = Math.cos(f.hd) >= 0 ? 1 : -1; f.spd = f.sp; f.scared = 0; newTarget(f); });
    },
    resize(w, h){
      W = w; H = h; const vh = S.h - S.top;
      k = Math.min(W/S.w, H/vh); ox = (W - S.w*k)/2; oy = (H - vh*k)/2 - S.top*k;
      if(root) root.style.transform = `translate(${ox}px,${oy}px) scale(${k})`;
    },
    step(dt){
      t += dt;
      if(!feed.drag && C.feed.returnHome){ feed.x += (C.feed.x - feed.x)*Math.min(1, dt*5); feed.y += (C.feed.y - feed.y)*Math.min(1, dt*5); }
      feedEl.style.transform = `translate(${feed.x}px,${feed.y}px)`;
      const fc = { x:feed.x + feed.w/2, y:feed.y + feed.h*.85 };
      const near = fc.x > T.x - C.feed.near && fc.x < T.x + T.w + C.feed.near && fc.y > T.y - C.feed.near - 60 && fc.y < T.y + T.h + C.feed.near;
      const follow = near && (feed.drag || !C.feed.returnHome || Math.hypot(feed.x - C.feed.x, feed.y - C.feed.y) > 40);
      for(const f of fish){
        const minX = T.x + f.w/2, maxX = T.x + T.w - f.w/2, minY = T.y + f.h/2, maxY = T.y + T.h - f.h/2;
        let tx, ty, tsp, turn;
        if(follow){ tx = clamp(fc.x + Math.cos(f.ang0 + t*.7)*60, minX, maxX); ty = clamp(fc.y + Math.sin(f.ang0 + t*.7)*35, minY, maxY); tsp = f.sp*C.followSpeed; turn = 2.6; }
        else { if(t > f.re || Math.hypot(f.tx - f.x, f.ty - f.y) < 40) newTarget(f); tx = f.tx; ty = f.ty; tsp = f.sp*(feed.drag ? C.excited : 1); turn = 1.1; }
        const dx = tx - f.x, dy = ty - f.y, dist = Math.hypot(dx, dy);
        if(f.scared > 0){ f.scared -= dt; turn = .5; tsp = Math.max(tsp, f.spd); }
        // 수평 위주로 부드럽게 방향 전환 (회전 속도 제한)
        let want = clamp(Math.atan2(dy, Math.abs(dx)), -.6, .6); if(dx < 0) want = Math.PI - want;
        const da = wrapA(want - f.hd); f.hd = wrapA(f.hd + clamp(da, -turn*dt, turn*dt));
        tsp *= follow ? Math.max(.25, Math.min(1, dist/80)) : Math.max(.45, Math.min(1, dist/120));
        f.spd += (tsp - f.spd)*Math.min(1, dt*(f.scared > 0 ? .9 : 1.6));
        f.x += Math.cos(f.hd)*f.spd*dt; f.y += Math.sin(f.hd)*f.spd*.65*dt;
        if(f.x < minX){ f.x = minX; f.hd = wrapA(Math.PI - f.hd); } if(f.x > maxX){ f.x = maxX; f.hd = wrapA(Math.PI - f.hd); }
        if(f.y < minY){ f.y = minY; f.hd = Math.abs(f.hd); } if(f.y > maxY){ f.y = maxY; f.hd = -Math.abs(f.hd); }
        const tf = Math.cos(f.hd) >= 0 ? 1 : -1; f.face += (tf - f.face)*Math.min(1, dt*3.2);
        const ra = clamp(Math.atan2(Math.sin(f.hd)*.65, Math.abs(Math.cos(f.hd)) + .05), -.4, .4); f.ra += (ra - f.ra)*Math.min(1, dt*3);
        maybeDepth(f);
        const ds = .86 + .14*(f.z - 1)/8;                 // 뒤쪽일수록 살짝 작게
        const sw = Math.sin(t*(5 + f.spd*.03) + f.ph)*2.2;
        const fx = (f.face < 0 ? Math.min(-.1, f.face) : Math.max(.1, f.face))*(f.cfg.flip ? -1 : 1);

function keySound(type, big, up){

    const s = ac.createBufferSource(); s.buffer = noiseBuf; const fl = ac.createBiquadFilter(); fl.type = ft; fl.frequency.value = f; fl.Q.value = q;
    const gn = ac.createGain(); gn.gain.setValueAtTime(.0001, at); gn.gain.exponentialRampToValueAtTime(g, at + .002); gn.gain.exponentialRampToValueAtTime(.0001, at + dur);
    s.connect(fl); fl.connect(gn); gn.connect(master); s.start(at, Math.random()*.4); s.stop(at + dur + .02); };

    const gn = ac.createGain(); gn.gain.setValueAtTime(.0001, at); gn.gain.exponentialRampToValueAtTime(g, at + .003); gn.gain.exponentialRampToValueAtTime(.0001, at + dur);

    if(big){ nz(t + .018, 900, .05, .25, 'lowpass', 1); tn(t + .016, 95, 70, .08, .3); }   // 스페이스바 덜컹

    nz(t + .014, 1700*r*b, .03, .55, 'bandpass', 1.3); tn(t + .014, 230*r*b, 150*b, .04, .25);   // 바닥
  }
}

    hover(p){ return !!hit(toScene(p)); },

    cancel(){ this.up(); }

/* 7) 빵 스퀴시: 진열장에서 빵 고르기 → 크게 꺼내기 → 꾹 누르면 말랑하게 들어가고 오래 누르면 구겨짐 */
// 누르는 동안만 이어지는 '푸슈슉' (짧게 누르면 짧게, 길게 누르면 길게)

    const fl = ac.createBiquadFilter(); fl.type = ft; fl.Q.value = q; fl.frequency.setValueAtTime(f1, at); fl.frequency.exponentialRampToValueAtTime(f2, at + fdur);
    const gn = ac.createGain(); gn.gain.setValueAtTime(.0001, at); gn.gain.exponentialRampToValueAtTime(gPeak, at + .03); gn.gain.setTargetAtTime(gHold, at + .08, holdT);

    live.forEach(({ s, gn }) => { gn.gain.cancelScheduledValues(n); gn.gain.setValueAtTime(Math.max(gn.gain.value, .0001), n); gn.gain.exponentialRampToValueAtTime(.0001, n + .09); s.stop(n + .12); });
  } };
}

const EXP_TYPES = { aquarium:Aquarium, keyboard:Keyboard, bakery:Bakery };

  const img = new Image(); img.src = cfg.src;
  const exp = (EXP_TYPES[cfg.exp] || EXP_TYPES.aquarium)(img);

  if(exp.dom){ cv.remove(); exp.mount(zl, stage); stage.style.cursor = 'default'; }
  const zoomOn = cfg.zoom !== false;     // zoom:false → 이 창은 확대/축소 없음

    resize(){ W = stage.clientWidth || 1; H = stage.clientHeight || 1; const dpr = Math.min(devicePixelRatio || 1, 2);

    enter(){ this.resize(); z.s = 1; z.tx = z.ty = 0; applyZ(); exp.init(W, H); },
    frame(dt){ exp.step(dt); if(exp.dom) return; ctx.fillStyle = exp.bg; ctx.fillRect(0, 0, W, H); exp.draw(ctx); }

  function clampZ(){ z.s = clamp(z.s, CONFIG.ZOOM.min, CONFIG.ZOOM.max); z.tx = clamp(z.tx, W - W*z.s, 0); z.ty = clamp(z.ty, H - H*z.s, 0); }
  function applyZ(){ zl.style.transform = `translate(${z.tx}px,${z.ty}px) scale(${z.s})`; }
  function zoomAt(px, py, ns){ ns = clamp(ns, CONFIG.ZOOM.min, CONFIG.ZOOM.max); z.tx = px - (px - z.tx)*(ns/z.s); z.ty = py - (py - z.ty)*(ns/z.s); z.s = ns; clampZ(); applyZ(); }

  const local = e => { const r = zl.getBoundingClientRect(); return { x:(e.clientX - r.left)*W/r.width, y:(e.clientY - r.top)*H/r.height }; };

/* ========================= 창 이동 (느린 페이드) ========================= */
let cur = 'main', prev = null, navBusy = false;
function go(id, after){
  closeMenu(); closeDrum(); $('#how').classList.remove('open');
  if(id === cur){ after && after(); return; }
  if(navBusy || !pages[id]) return;
  navBusy = true; prev = cur;
  pages[cur].classList.remove('show');
  const lep = expPages.find(p => p.key === cur); if(lep && lep.exp.leave) lep.exp.leave();
  setTimeout(() => {
    cur = id; const ep = expPages.find(p => p.key === id); if(ep) ep.enter();
    setHeader(ep ? ep.i : -1);
    if(id === 'main') layout();
    pages[id].classList.add('show');
    setTimeout(() => { navBusy = false; prev = null; after && after(); }, CONFIG.FADE_MS*.6);
  }, CONFIG.FADE_MS);
}

/* ========================= 메뉴 ========================= */
menu.querySelectorAll('em').forEach(em => em.textContent = em.dataset.label);
function closeMenu(){ menu.classList.remove('open'); menuBtn.classList.remove('on'); menu.querySelectorAll('li.open').forEach(l => l.classList.remove('open')); }
document.addEventListener('pointerdown', e => { if(menu.classList.contains('open') && !e.target.closest('#menu li,#menuBtn')) closeMenu(); });
menuBtn.addEventListener('click', () => { const o = !menu.classList.contains('open'); menu.classList.toggle('open', o); menuBtn.classList.toggle('on', o); });
$('#logo').addEventListener('click', () => go('main'));
menu.querySelectorAll('li').forEach(li => {
  li.addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse'){ li.classList.add('touch'); } });
  li.addEventListener('click', e => {
    if(li.dataset.go === 'sound'){        // 소리 메뉴: 아이콘 = 음소거 켜기/끄기, 슬라이더 = 크기
      if(e.target.closest('.vol')) return;
      if(touchUI.matches && !li.classList.contains('open')){ li.classList.add('open'); return; }
      setVolume(vol > 0 ? 0 : (lastVol || .7)); return;
    }
    const delay = li.classList.contains('touch') ? 260 : 0;
    setTimeout(() => {
      li.classList.remove('touch');
      const g = li.dataset.go;
      if(g === 'hint') go('main', () => playHint());
      else go(g);
    }, delay);
  });
  li.addEventListener('pointerleave', () => li.classList.remove('touch'));
  if(li.dataset.go === 'sound'){ li.addEventListener('pointerdown', e => { li.classList.remove('touch'); }); }
});

/* ========================= 상단: 제목 / 돌아가는 메뉴 / how to play ========================= */
const touchUI = matchMedia('(hover: none), (pointer: coarse)');
let curExp = -1;
function setHeader(i){
  curExp = i; document.body.classList.toggle('on-exp', i >= 0);
  if(i < 0) return;
  const c = CONFIG.ITEMS[i];
  $('#titleText').textContent = c.title || c.name || '';
  const ul = $('#howList'); ul.innerHTML = ''; (c.howto || []).forEach(h => { const li = document.createElement('li'); li.textContent = h; ul.appendChild(li); });
}
// how to play : PC는 호버, 모바일은 한 번 누르면 열리고 다시 누르면 닫힘
$('#howBtn').addEventListener('click', e => { if(touchUI.matches){ $('#how').classList.toggle('open'); closeDrum(); } });

// 돌아가는(드럼) 메뉴
const drum = $('#drum'), wheel = drum.querySelector('.wheel'), titleBtn = $('#titleBtn');
const STEP = 24, SLOT_H = 46, RAD = SLOT_H/2/Math.tan(STEP*Math.PI/360) + 2, SLOTS = 9;
const ARROW = '<svg viewBox="0 0 36 22"><path d="M0 11 12 0v6h24v10H12v6z" fill="#ff5a5a"/></svg>';
let rot = 0, rotAnim = null, hlK = null, snapT = 0;
const slotEls = Array.from({ length:SLOTS }, () => { const s = document.createElement('div'); s.className = 'slot';
  s.innerHTML = `<div class="box"></div><div class="arr">${ARROW}</div>`; wheel.appendChild(s); return s; });
wheel.style.transform = `translateZ(${-RAD}px)`;
const nItems = () => CONFIG.ITEMS.length, modI = k => ((k % nItems()) + nItems()) % nItems();
function renderDrum(){
  const c = Math.round(rot/STEP);
  slotEls.forEach((s, j) => {
    const kk = c + j - (SLOTS >> 1), a = kk*STEP - rot, i = modI(kk);
    s.dataset.k = kk; s.dataset.i = i;
    s.firstChild.textContent = CONFIG.ITEMS[i].name || '';
    s.style.transform = `rotateX(${-a}deg) translateZ(${RAD}px)`;
    s.style.opacity = Math.abs(a) > 84 ? 0 : 1;
    s.classList.toggle('hl', kk === c);     // 가운데 칸이 선택된 상태
  });
}
function spinTo(target, dur){
  const from = rot, t0 = now(); rotAnim = (t) => { const k = clamp((t - t0)/dur, 0, 1), e = 1 - Math.pow(1 - k, 4); rot = from + (target - from)*e; renderDrum(); if(k >= 1) rotAnim = null; };
}
function openDrum(){
  hlK = null; drum.classList.add('open'); titleBtn.classList.add('open'); $('#how').classList.remove('open');
  const target = Math.max(0, curExp)*STEP; rot = target - 360; renderDrum(); spinTo(target, 1100);   // 열 때마다 한 바퀴 돌며 등장
}
function closeDrum(){ drum.classList.remove('open'); titleBtn.classList.remove('open'); hlK = null; }
titleBtn.addEventListener('click', () => drum.classList.contains('open') ? closeDrum() : openDrum());
drum.addEventListener('wheel', e => { e.preventDefault(); rotAnim = null; rot += e.deltaY*.12; renderDrum(); clearTimeout(snapT); snapT = setTimeout(() => spinTo(Math.round(rot/STEP)*STEP, 300), 140); }, { passive:false });
let dd = null;
drum.addEventListener('pointerdown', e => { dd = { y:e.clientY, r:rot, moved:false, slot:e.target.closest('.slot'), arr:!!e.target.closest('.arr') }; rotAnim = null; try{ drum.setPointerCapture(e.pointerId); }catch(_){} });
drum.addEventListener('pointermove', e => { if(!dd) return; const dy = e.clientY - dd.y; if(Math.abs(dy) > 6) dd.moved = true;
  if(dd.moved){ rot = dd.r - dy*.55; renderDrum(); } });
drum.addEventListener('pointerup', e => {
  if(!dd) return; const d = dd; dd = null;
  if(d.moved){ spinTo(Math.round(rot/STEP)*STEP, 350); return; }
  if(!d.slot) return;
  const i = +d.slot.dataset.i, kk = +d.slot.dataset.k;
  if(kk !== Math.round(rot/STEP)){ spinTo(kk*STEP, 380); return; }   // 다른 칸을 누르면 가운데로 돌아옴
  closeDrum(); go('exp' + i);       // 가운데 칸을 누르면 이동 (PC/모바일 동일)
});
drum.addEventListener('pointercancel', () => { dd = null; });
document.addEventListener('pointerdown', e => {
  if(!e.target.closest('#drum,#titleBtn')) closeDrum();
  if(!e.target.closest('#how')) $('#how').classList.remove('open');
});

/* ========================= 루프 ========================= */
let lt = now();
function loop(t){
  const dt = Math.min(.05, (t - lt)/1000); lt = t;
  if(rotAnim) rotAnim(t);
  if(cur === 'main' || prev === 'main'){ deviceTick(dt); physics(dt, t); }
  faceTick(t);
  for(const ep of expPages) if(ep.key === cur || ep.key === prev) ep.frame(dt);
  requestAnimationFrame(loop);
}

addEventListener('resize', () => layout());
mq.addEventListener ? mq.addEventListener('change', () => layout()) : mq.addListener(() => layout());
layout(); faceIdle();
requestAnimationFrame(t => { lt = t; loop(t); });
})();
</script>
