<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d1940">
<title>☁︎</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0d0f1a;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;font-family:system-ui,-apple-system,sans-serif;color:#fff}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden;display:none}
.screen.active{display:block}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
button{border:0;background:none;color:inherit;cursor:pointer;font:inherit;touch-action:manipulation;outline:none}
input{-webkit-user-select:text;user-select:text}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.glass{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.34);box-shadow:0 8px 28px rgba(10,10,40,.18)}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .25s,background .25s,opacity .3s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.ib:hover{transform:scale(1.08);background:rgba(255,255,255,.3)}
.ib:active{transform:scale(.94)}

/* menu */
#menu{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:50;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#menuBtn{pointer-events:auto}
#menuList{display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transform:translateY(-10px) scale(.9);transform-origin:top center;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
#menu.open #menuList{opacity:1;pointer-events:auto;transform:none}
#menuBtn svg{transition:transform .35s}
#menu.open #menuBtn svg{transform:rotate(90deg)}

/* veil */
/* home: white page, ring of worlds */
#home{background:#fff;color:#16161e;overflow:hidden}
#hDither{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
#hRing{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hTitle{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 88px);transform:translateX(-50%);width:min(760px,calc(100vw - 150px));height:170px;pointer-events:none;z-index:2;transition:opacity .45s ease}
#home.det #hTitle{opacity:0}
@media (max-width:640px){#hTitle{width:calc(100vw - 32px);top:calc(max(10px,env(safe-area-inset-top)) + 100px);height:190px}}
#hCap{position:absolute;left:50%;top:70%;transform:translate(-50%,10px);width:min(560px,calc(100vw - 40px));text-align:center;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
#hCap.on{opacity:1;transform:translate(-50%,0)}
#hCap h2{font:650 clamp(24px,3.2vw,38px)/1.1 system-ui,sans-serif;letter-spacing:-.02em;margin:0}
#hCap h2 small{display:block;font:500 clamp(12px,1.3vw,14px)/1.4 system-ui,sans-serif;letter-spacing:.04em;color:#6d6d82;margin-top:6px}
#hCap .more{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
#hCap .more>*{overflow:hidden}
#hCap.det .more{grid-template-rows:1fr;opacity:1}
#hCap.det{pointer-events:auto}
#hCap .more{justify-items:center}
#hCap #hEnter{margin-top:16px}
#hHint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font:italic 500 12px/1 system-ui,sans-serif;letter-spacing:.12em;color:#16161e;opacity:.4;pointer-events:none;animation:hpulse 2.2s ease-in-out infinite}
@keyframes hpulse{50%{opacity:.18}}
#hBack{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:6;opacity:0;pointer-events:none;transform:scale(.85);transition:opacity .3s,transform .3s,background .25s}
#hBack.on{opacity:1;pointer-events:auto;transform:none}

/* gallery: hover image reveal */
.panel.gpanel{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;color:#16161e;justify-content:flex-start;align-items:center;padding-left:clamp(26px,9vw,140px);overflow:hidden}
#galDither{position:absolute;inset:0;width:100%;height:100%;opacity:.85;pointer-events:none}
.gpanel .pclose{z-index:3}
#galList{position:relative;z-index:1;display:flex;flex-direction:column;gap:0;align-items:flex-start}
.gRow{overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gIn{display:block;position:relative;font:400 clamp(40px,7.4vw,80px)/1.16 Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.05em;color:#16161e;white-space:pre;transition:transform .42s cubic-bezier(.2,.9,.25,1),color .2s ease}
.gIn span{display:block}
.gIn span+span{position:absolute;top:100%;left:0;width:100%}
.gRow.on .gIn{transform:translateY(-100%)}
.gpanel.act .gRow:not(.on) .gIn{color:#bdbdc6}
#galImg{position:absolute;top:0;left:0;width:320px;height:190px;overflow:hidden;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s ease;will-change:transform}
.gpanel.act #galImg{opacity:1}
.gPic{position:absolute;inset:0;background-size:cover;background-position:center;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
@media (max-width:600px){#galImg{width:62vw;height:37vw}}
.galon #menu .ib{color:#2a2a35}
.galon #menu .gm{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.2));border-color:rgba(40,40,80,.12)}

/* counting-sheep game */


/* panels: no press feedback on the glass cards themselves */
#sphere.panel{display:block;overflow:hidden;background:#fff;color:#16161e;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none}
#sphDither{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none;z-index:0}
#sphere .pclose{z-index:3}
#sphRows{position:absolute;inset:0;z-index:1;overflow:hidden}
#sphTrack{height:100%;display:flex;transition:transform .75s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sphRow{flex:0 0 100%;width:100%;min-width:0;height:100%;position:relative;overflow:hidden}
.cgBox{position:absolute;left:0;right:0;top:max(24px,env(safe-area-inset-top));bottom:max(50px,calc(env(safe-area-inset-bottom) + 40px))}
.cgStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;perspective:2000px}
.cgRing{position:relative;width:0;height:0;transform-origin:center}
.cgCard{position:absolute;left:0;top:0;margin:-180px 0 0 -160px;width:320px;height:360px;border-radius:32px;overflow:hidden;transform-origin:center;transform-style:preserve-3d;cursor:pointer}
.cgCard img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none;-webkit-backface-visibility:hidden;backface-visibility:hidden;pointer-events:none}
.cgTxt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;--k:1;z-index:2;transition:opacity .35s ease}
.cgTxt h2{margin:0;font-size:calc(28px*var(--k));font-weight:600;letter-spacing:-.01em;line-height:1.2}
.cgTxt h2 small{display:inline-block;margin-left:10px;font-size:max(11px,calc(13px*var(--k)));font-weight:500;color:#6b6b7d;letter-spacing:0;white-space:nowrap}
.cgTxt p{margin:calc(14px*var(--k)) 0 0;font-size:max(11px,calc(14.5px*var(--k)));line-height:1.7;color:#3a3a4a;word-break:keep-all}
.cgTxt .sphGo{display:inline-grid;place-items:center;width:44px;height:44px;margin-top:calc(16px*var(--k));border-radius:50%;border:1px solid rgba(40,40,80,.14);background:rgba(255,255,255,.75);color:#22222e;cursor:pointer}
.sphRow.zoom .cgTxt{opacity:0;pointer-events:none}
.sphRow.zoom .cgBox{cursor:grab;touch-action:none}.sphRow.zoom .cgBox.dragging{cursor:grabbing}.sphRow.zoom .cgCard{cursor:inherit}
.cgClose{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:4;opacity:0;pointer-events:none;transform:scale(.85);transition:opacity .3s,transform .3s;color:#22222e;border-color:rgba(40,40,80,.14);background:rgba(255,255,255,.75)}
.sphRow.zoom .cgClose{opacity:1;pointer-events:auto;transform:none}
#sphere .pclose,#sphNav{transition:opacity .3s}
#sphere.cgzoom .pclose,#sphere.cgzoom #sphNav{opacity:0;pointer-events:none}
#sphNav{position:absolute;inset:0;z-index:3;pointer-events:none}
#sphPrev,#sphNext{position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto}
#sphPrev{left:max(20px,env(safe-area-inset-left))}
#sphNext{right:max(20px,env(safe-area-inset-right))}
#sphere .pclose{display:none}
#sphNav .gm{width:46px;height:46px;color:#22222e;border-color:rgba(40,40,80,.14);background:rgba(255,255,255,.75)}
#sphDots{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;align-items:center;pointer-events:auto}
#sphDots i{width:10px;height:10px;border-radius:50%;background:rgba(40,40,80,.2);cursor:pointer;transition:background .3s,transform .3s}
#sphDots i.on{background:#22222e;transform:scale(1.25)}
#pageView{position:fixed;inset:0;z-index:58;background:#fff;display:none}
#pageView.on{display:block}
#pageView iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#pvMenu{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:2;display:flex;flex-direction:column;gap:10px}
#pvMenuList{display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transform:translateY(-10px) scale(.9);transform-origin:top center;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
#pvMenu.open #pvMenuList{opacity:1;pointer-events:auto;transform:none}
#pvMenuBtn svg{transition:transform .35s}#pvMenu.open #pvMenuBtn svg{transform:rotate(90deg)}
#pageView .gm{background:rgba(255,255,255,.72);color:#22222e;border-color:rgba(40,40,80,.14)}
/* glassmorphism */
.gm{background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.1));-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.08)!important;filter:none!important}
.lightbg .gm,#home .gm{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.2));border-color:rgba(40,40,80,.12);color:#22222e}
.gm:hover{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.25))}
.gm:active,.gm.sel{background:rgba(255,255,255,.96)!important;color:#1b1b26!important;border-color:rgba(255,255,255,.95)}
.lightbg .gm.sel,.lightbg .gm:active{border-color:rgba(40,40,80,.16)}
.gbtn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:11px 20px;border-radius:999px;font:600 14px/1 system-ui,sans-serif;letter-spacing:.02em;cursor:pointer;transition:background .25s,transform .25s}
.gbtn:hover{transform:translateY(-1px)}
#home.det #hHint{opacity:0;animation:none}

#veil{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;background-color:#0b0d18;background-size:cover}

/* aesthetic backgrounds */

/* home */

/* panels */
.panel{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:max(84px,calc(env(safe-area-inset-top) + 76px)) 18px max(24px,env(safe-area-inset-bottom));background:rgba(12,10,28,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .45s}
.panel.on{opacity:1;pointer-events:auto}
.pclose{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}













/* lighter, clearer glass for the game panels */
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen active">
    <canvas id="hDither"></canvas><canvas id="hRing"></canvas><canvas id="hTitle" role="img" aria-label="Play in Your Aesthetic"></canvas>
    <div id="hCap"><h2></h2><div class="more"><button id="hEnter" class="gm gbtn" type="button">들어가기 <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>
    <div id="hHint">scroll · drag · hover · 1–4</div>
    <button id="hBack" class="ib gm" data-ic="close" aria-label="back"></button>
    
  </section>
</div>

<nav id="menu">
  <button id="menuBtn" class="ib gm" data-ic="menu" aria-label="menu"></button>
  <div id="menuList">
    <button class="ib gm" data-go="home" data-ic="home" aria-label="home"></button>
    <button class="ib gm" data-panel="gallery" data-ic="grid" aria-label="gallery"></button>
    <button class="ib gm" data-panel="sphere" data-ic="globe" aria-label="sphere"></button>
  </div>
</nav>

<div id="gallery" class="panel gpanel"><canvas id="galDither"></canvas><button class="ib gm pclose" data-ic="close" aria-label="close"></button><div id="galImg"></div><div id="galList"></div></div>
<div id="sphere" class="panel"><canvas id="sphDither"></canvas><button class="ib gm pclose" data-ic="close" aria-label="close"></button><div id="sphRows"><div id="sphTrack"></div></div><div id="sphNav"><button id="sphPrev" class="ib gm" type="button" aria-label="previous"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><div id="sphDots"></div><button id="sphNext" class="ib gm" type="button" aria-label="next"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div></div>
<div id="pageView"><iframe id="pageFrame" title="page"></iframe><div id="pvMenu"><button class="ib gm" id="pvMenuBtn" data-ic="menu" aria-label="menu"></button><div id="pvMenuList"><button class="ib gm" id="pvHome" data-ic="home" aria-label="home"></button><button class="ib gm" id="pvClose" data-ic="close" aria-label="close"></button></div></div></div>
<div id="veil"></div>

/* ---- tiny mat4 helpers (column-major) ---- */
const M4={
  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;},
  id(){const o=new Float32Array(16);o[0]=o[5]=o[10]=o[15]=1;return o;},
  tr(x,y,z){const o=M4.id();o[12]=x;o[13]=y;o[14]=z;return o;},
  rx(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o;},
  ry(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o;},
  rz(a){const o=M4.id(),c=Math.cos(a),s=Math.sin(a);o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o;},
  persp(fov,ar,n,f){const o=new Float32Array(16),t=1/Math.tan(fov/2);o[0]=t/ar;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;},
  app(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14],m[3]*x+m[7]*y+m[11]*z+m[15]];}
};
function glProg(gl,vs,fs){const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(o));return null;}return o;};
  const a=sh(gl.VERTEX_SHADER,vs),b=sh(gl.FRAGMENT_SHADER,fs);if(!a||!b)return null;const p=gl.createProgram();gl.attachShader(p,a);gl.attachShader(p,b);gl.linkProgram(p);return gl.getProgramParameter(p,gl.LINK_STATUS)?p:null;}
function glTex(gl,img){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
function planeGrid(nx,ny){const v=[];for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const x0=i/nx,x1=(i+1)/nx,y0=j/ny,y1=(j+1)/ny;v.push(x0,y0,x1,y0,x0,y1,x0,y1,x1,y0,x1,y1);}return new Float32Array(v);}

  const FIELD=`#version 300 es
